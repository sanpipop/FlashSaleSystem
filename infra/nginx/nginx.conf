user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Prometheus already records request counts and latency for successful
    # product reads. Avoid synchronously serializing thousands of duplicate
    # access-log lines per second on the 4-vCPU target, while retaining every
    # non-product request and every non-2xx product response for diagnosis.
    map "$request_method:$uri:$status" $access_loggable {
        default 1;
        ~^GET:/api/v1/products:2 0;
    }

    log_format flash_sale '$request_id $remote_addr $request_method $uri '
                          '$status $request_time $upstream_addr $upstream_response_time';
    access_log /dev/stdout flash_sale if=$access_loggable;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    # Keep read-heavy traffic away from the latency-sensitive admission path.
    # Three read event loops retain the measured baseline read capacity while a
    # fourth event loop prevents the order admission path from being starved.
    upstream api_read_backend {
        least_conn;
        # Docker restarts unhealthy containers. Disabling passive eviction here
        # prevents a short CPU spike from marking every healthy API unavailable.
        server api-1:3000 max_fails=0;
        server api-2:3000 max_fails=0;
        server api-4:3000 max_fails=0;
        keepalive 192;
    }

    upstream api_admission_backend {
        least_conn;
        server api-3:3000 max_fails=1 fail_timeout=2s;
        # These instances normally serve reads. They become active for orders
        # only when the dedicated admission instance is unreachable.
        server api-1:3000 backup max_fails=0;
        server api-2:3000 backup max_fails=0;
        server api-4:3000 backup max_fails=0;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        location /grafana/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://grafana:3000;
        }

        # Bulkhead the write admission path so a read flood cannot starve every
        # API event loop and force Nginx to return a 504 before enqueue completes.
        location = /api/v1/orders {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            # Retrying a POST is safe here because Redis SET NX and the
            # deterministic BullMQ job ID make admission idempotent.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_pass http://api_admission_backend;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_pass http://api_read_backend;

        }
    }
}
