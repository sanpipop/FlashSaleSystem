user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format flash_sale '$request_id $remote_addr $request_method $uri '
                          '$status $request_time $upstream_addr $upstream_response_time';
    access_log /dev/stdout flash_sale;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    upstream api_backend {
        least_conn;
        server api-1:3000 max_fails=2 fail_timeout=5s;
        server api-2:3000 max_fails=2 fail_timeout=5s;
        server api-3:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        location /grafana/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://grafana:3000;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_pass http://api_backend;

            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
        }
    }
}
