global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: flash-sale-api
    metrics_path: /metrics
    static_configs:
      - targets: [api-1:3000, api-2:3000, api-3:3000, api-4:3000]

  - job_name: flash-sale-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:9464]

  - job_name: flash-sale-vm
    static_configs:
      - targets: [node-exporter:9100]
