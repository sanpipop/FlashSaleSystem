name: Manual k6 load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public URL of the Flash Sale system, for example https://team-x.example.com
        required: true
        type: string
      profile:
        description: Test profile defined by k6/competition.js
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - read-heavy
          - hot-product
          - competition

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k6:
    name: k6-${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the competition scenario
        shell: bash
        run: |
          if [[ ! -f k6/competition.js ]]; then
            echo "::error::Missing k6/competition.js. Add the agreed load-test scenario first."
            exit 1
          fi
          mkdir -p artifacts

      - name: Run k6
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_PROFILE: ${{ inputs.profile }}
        run: |
          docker run --rm \
            -e BASE_URL \
            -e TEST_PROFILE \
            -v "$PWD/k6:/scripts:ro" \
            -v "$PWD/artifacts:/results" \
            grafana/k6:latest run \
            --summary-export=/results/summary.json \
            /scripts/competition.js

      - name: Upload k6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.profile }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

