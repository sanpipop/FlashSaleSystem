name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quick-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Node.js project
        id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "node_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "node_project=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet; source checks were skipped."
          fi

      - name: Setup Node.js
        if: steps.project.outputs.node_project == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.project.outputs.node_project == 'true'
        run: corepack enable

      - name: Validate pnpm metadata
        if: steps.project.outputs.node_project == 'true'
        shell: bash
        run: |
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error::package.json exists but pnpm-lock.yaml is missing."
            exit 1
          fi

          if ! grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@[0-9]+\.[0-9]+\.[0-9]+' package.json; then
            echo "::error::Set packageManager to an exact pnpm version in package.json."
            exit 1
          fi

      - name: Locate pnpm store
        if: steps.project.outputs.node_project == 'true'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        if: steps.project.outputs.node_project == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.project.outputs.node_project == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Type check
        if: steps.project.outputs.node_project == 'true'
        run: pnpm run --if-present typecheck

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          compose_file=""
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [[ -f "$candidate" ]]; then
              compose_file="$candidate"
              break
            fi
          done

          if [[ -n "$compose_file" ]]; then
            docker compose -f "$compose_file" config --quiet
          else
            echo "No Compose file yet; skipping Compose syntax validation."
          fi
