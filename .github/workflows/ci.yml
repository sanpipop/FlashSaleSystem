name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-integration:
    name: quality-and-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashsale
          POSTGRES_PASSWORD: flashsale_ci
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashsale -d flashsale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis_queue:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis_cache:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://flashsale:flashsale_ci@localhost:5432/flashsale
      REDIS_URL: redis://localhost:6379
      REDIS_QUEUE_URL: redis://localhost:6379
      REDIS_CACHE_URL: redis://localhost:6380
      JWT_SECRET: ci-only-not-a-production-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Node.js project
        id: project
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "node_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "node_project=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet; repository-policy checks only."
          fi

      - name: Setup Node.js
        if: steps.project.outputs.node_project == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.project.outputs.node_project == 'true'
        run: corepack enable

      - name: Require reproducible pnpm metadata
        if: steps.project.outputs.node_project == 'true'
        shell: bash
        run: |
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error::package.json exists but pnpm-lock.yaml is missing. Commit the lockfile."
            exit 1
          fi

          if ! grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@[0-9]+\.[0-9]+\.[0-9]+' package.json; then
            echo "::error::Set packageManager to an exact pnpm version, for example pnpm@10.0.0."
            exit 1
          fi

      - name: Locate pnpm store
        if: steps.project.outputs.node_project == 'true'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm package cache
        if: steps.project.outputs.node_project == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.project.outputs.node_project == 'true'
        run: pnpm install --frozen-lockfile

      - name: Require quality scripts
        if: steps.project.outputs.node_project == 'true'
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const required=['lint','typecheck','test','test:integration','build','db:migrate']; const missing=required.filter(name => !p.scripts?.[name]); if (missing.length) { console.error('Missing required package scripts: ' + missing.join(', ')); process.exit(1); }"

      - name: Lint
        if: steps.project.outputs.node_project == 'true'
        run: pnpm lint

      - name: Type check
        if: steps.project.outputs.node_project == 'true'
        run: pnpm typecheck

      - name: Unit tests
        if: steps.project.outputs.node_project == 'true'
        run: pnpm test

      - name: Build
        if: steps.project.outputs.node_project == 'true'
        run: pnpm build

      - name: Apply database migrations
        if: steps.project.outputs.node_project == 'true'
        run: pnpm db:migrate

      - name: Integration tests
        if: steps.project.outputs.node_project == 'true'
        run: pnpm test:integration

      - name: Validate Docker Compose
        shell: bash
        run: |
          compose_file=""
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [[ -f "$candidate" ]]; then
              compose_file="$candidate"
              break
            fi
          done

          if [[ -n "$compose_file" ]]; then
            docker compose -f "$compose_file" config --quiet
          else
            echo "No Compose file yet; skipping Compose validation."
          fi
