name: Compose smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Docker Compose file
        id: compose
        shell: bash
        run: |
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [[ -f "$candidate" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "file=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "No Compose file yet; smoke test is not active."

      - name: Require smoke-test script
        if: steps.compose.outputs.exists == 'true'
        shell: bash
        run: |
          if [[ ! -f scripts/smoke-test.sh ]]; then
            echo "::error::Compose exists but scripts/smoke-test.sh is missing."
            exit 1
          fi

      - name: Build and wait for services
        if: steps.compose.outputs.exists == 'true'
        run: >-
          docker compose -f "${{ steps.compose.outputs.file }}"
          up --detach --build --wait --wait-timeout 180

      - name: Show service status
        if: steps.compose.outputs.exists == 'true'
        run: docker compose -f "${{ steps.compose.outputs.file }}" ps

      - name: Run project smoke script
        if: steps.compose.outputs.exists == 'true'
        run: bash scripts/smoke-test.sh

      - name: Collect Compose logs
        if: always() && steps.compose.outputs.exists == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f "${{ steps.compose.outputs.file }}" logs --no-color > artifacts/compose.log

      - name: Upload Compose logs
        if: always() && steps.compose.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs-${{ github.run_number }}
          path: artifacts/compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop services
        if: always() && steps.compose.outputs.exists == 'true'
        run: docker compose -f "${{ steps.compose.outputs.file }}" down --volumes --remove-orphans
