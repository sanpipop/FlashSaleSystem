name: งานพัฒนา
description: สร้างงานที่มีขอบเขตชัดเจนสำหรับคนหรือ AI
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: goal
    attributes:
      label: เป้าหมาย
      description: เมื่อทำเสร็จ ระบบต้องมีพฤติกรรมอย่างไร
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: ไฟล์หรือโฟลเดอร์ที่อนุญาตให้แก้
      description: ใช้ขอบเขตนี้กับทั้งสมาชิกและคำสั่งที่ส่งให้ AI
      placeholder: |
        apps/api/src/orders/**
        packages/contracts/src/order.ts
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract และข้อมูลเข้าออก
      description: ระบุ endpoint, event/job payload, database function หรือ cache key ที่เกี่ยวข้อง
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: เงื่อนไขที่ถือว่าเสร็จ
      placeholder: |
        - คำขอซ้ำสร้างงานได้เพียงหนึ่งงาน
        - มี unit test และ integration test
        - lint, test และ build ผ่าน
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: คำสั่งและกรณีทดสอบ
      placeholder: pnpm test:integration -- order
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: งานที่ต้องรอหรือส่วนที่อาจได้รับผลกระทบ
      description: ใส่หมายเลข Issue หรือชื่อ Contract ที่เกี่ยวข้อง

  - type: checkboxes
    id: ready
    attributes:
      label: ตรวจสอบก่อนเริ่ม
      options:
        - label: งานนี้มีขนาดไม่เกินหนึ่งวัน
          required: true
        - label: ระบุสิ่งที่ห้าม AI เปลี่ยนแล้ว
          required: true
        - label: แจ้งทีมแล้วหากต้องแก้ Contract หรือไฟล์ส่วนกลาง
          required: true

