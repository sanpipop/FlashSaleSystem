name: รายงานปัญหา
description: บันทึก Bug พร้อมหลักฐานสำหรับทำซ้ำ
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: อาการที่พบ
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: ขั้นตอนทำให้เกิดปัญหา
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ผลที่ควรเกิด
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: หลักฐาน
      description: แนบ Request ID, Job ID, log, screenshot หรือผล k6 โดยห้ามใส่รหัสผ่าน
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: ระดับความรุนแรง
      options:
        - Critical - ข้อมูลผิด สต็อกติดลบ หรือซื้อซ้ำได้
        - High - ระบบล่มหรือ Error จำนวนมาก
        - Medium - ช้าหรือทำงานผิดบางกรณี
        - Low - UI, log หรือเอกสาร
    validations:
      required: true

