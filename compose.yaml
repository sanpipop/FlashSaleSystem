name: flash-sale-system

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  JWT_SECRET: ${JWT_SECRET:-local-only-replace-before-deploy}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-flashsale}
  POSTGRES_USER: ${POSTGRES_USER:-flashsale}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
  POSTGRES_POOL_MAX: 4
  REDIS_OPS_HOST: redis-ops
  REDIS_OPS_PORT: 6379
  REDIS_CACHE_HOST: redis-cache
  REDIS_CACHE_PORT: 6379
  NODE_OPTIONS: --max-old-space-size=240

x-api-service: &api-service
  image: flash-sale-api:local
  restart: unless-stopped
  environment: *api-environment
  depends_on:
    seed:
      condition: service_completed_successfully
    redis-ops:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  expose:
    - "3000"
  networks:
    - backend
  cpus: 0.40
  mem_limit: 320m
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null || exit 1"]
    interval: 5s
    timeout: 2s
    retries: 12
    start_period: 10s
  logging: *default-logging

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    networks:
      - edge
      - backend
    cpus: 0.10
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 6
    logging: *default-logging

  api-1:
    <<: *api-service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1

  api-2:
    <<: *api-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2

  api-3:
    <<: *api-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-3

  worker:
    image: flash-sale-worker:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_POOL_MAX: 12
      REDIS_OPS_HOST: redis-ops
      REDIS_OPS_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
      WORKER_CONCURRENCY: 8
      WORKER_BATCH_SIZE: 16
      WORKER_BATCH_WAIT_MS: 1
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      seed:
        condition: service_completed_successfully
      redis-ops:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - backend
    cpus: 0.90
    mem_limit: 640m
    logging: *default-logging

  migrate:
    image: flash-sale-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["node", "database/dist/cli/migrate.js"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_POOL_MAX: 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    cpus: 0.10
    mem_limit: 160m
    logging: *default-logging

  seed:
    image: flash-sale-worker:local
    command: ["node", "database/dist/cli/seed.js"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_POOL_MAX: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    cpus: 0.10
    mem_limit: 160m
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    cpus: 0.90
    mem_limit: 1400m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging

  redis-ops:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-ops.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-ops-data:/data
    networks:
      - backend
    cpus: 0.25
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    logging: *default-logging

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend
    cpus: 0.15
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-ops-data:
